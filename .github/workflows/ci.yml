name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        # Demo mode builds without any third-party credentials, so CI needs no
        # secrets to prove the application compiles and renders.
        env:
          NEXT_PUBLIC_DEMO_MODE: "1"
          DATABASE_URL: postgresql://user:password@localhost:5432/placeholder
        run: npm run build
